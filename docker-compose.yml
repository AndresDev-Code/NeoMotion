services:

  postgres:
    image: postgres:18-alpine
    container_name: neomotion-postgres
    environment:
      POSTGRES_DB: neomotion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - neomotion_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: neomotion-backend:latest
    container_name: neomotion-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/neomotion
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    volumes:
      - neomotion_uploads:/app/uploads

volumes:
  neomotion_postgres_data:
  neomotion_uploads: